name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Runs the connector tests against real PostgreSQL and Oracle Database Free servers.
  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: vibe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: vibe_admin
          APP_USER: vibe
          APP_USER_PASSWORD: vibe
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      VIBE_PG_HOST: localhost
      VIBE_PG_PASSWORD: vibe
      VIBE_ORACLE_CONNECT: localhost:1521/FREEPDB1
      VIBE_ORACLE_USER: vibe
      VIBE_ORACLE_PASSWORD: vibe
      VIBE_LIVE_ROWS: 1000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npx tsc -p tsconfig.test.json
      - run: node --test --test-reporter=spec out-test/test/live-db.test.js
